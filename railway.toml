[build]
builder = "dockerfile"
dockerfilePath = "Dockerfile"

[build.args]
GEINS_API_URL = "${{GEINS_API_URL}}"
AUTH_SECRET = "${{AUTH_SECRET}}"
BASE_URL = "${{BASE_URL}}"
GEINS_DEBUG = "${{GEINS_DEBUG}}"

[deploy]
startCommand = "node server/index.mjs"
healthcheckPath = "/"
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 3
